<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none';"><title>봄담이 캐릭터 PNG·GIF 다운로드 | AI봄</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8ee;color:#183e2c;font:16px/1.8 "Malgun Gothic",sans-serif}main{max-width:1100px;margin:auto;padding:36px 24px}h1{font-size:32px;line-height:1.4;letter-spacing:-1px}p{color:#506847}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:28px}.card{padding:22px;background:#fff;border:1px solid #cbd9ba;border-radius:20px}.art{height:340px;overflow:hidden;display:grid;place-items:center;background:linear-gradient(140deg,#fff,#f9f4e1);border-radius:14px}.art img{display:block;width:100%;height:340px;max-width:100%;max-height:340px;object-fit:contain}h2{font-size:21px}.links{display:flex;gap:10px;flex-wrap:wrap}a{color:#26543b}.download{display:inline-block;background:linear-gradient(145deg,#537356,#19432d);color:white;padding:11px 15px;border-radius:11px;text-decoration:none;border:1px solid #395f41;font-size:13px;font-weight:bold;box-shadow:inset 0 1px 0 #fff5}.gold{background:linear-gradient(145deg,#fff0b4,#d2ad4d);color:#3b341d;border-color:#b4913b}a:focus-visible{outline:3px solid #72a144;outline-offset:4px}.small{font-size:13px}.back{display:inline-block;margin-top:25px}@media(max-width:767px){main{padding:25px 20px}h1{font-size:27px}.grid{grid-template-columns:1fr}.art{height:290px}.art img{height:290px;max-height:290px}}</style><link rel="stylesheet" href="assets/inner-spring.css"><script defer src="assets/inner-spring.js"></script></head><body><main><h1>봄담이를 블로그에 초대하세요.</h1><p>PNG는 정지 이미지, GIF는 움직이며 눈을 깜빡이는 이미지입니다.<br>다운로드한 GIF를 네이버 블로그의 ‘사진’으로 첨부하세요.</p><div class="grid"><article class="card"><div class="art"><img src="assets/heart-bomdam-animated.gif" alt="하트를 안고 움직이며 눈을 깜빡이는 봄담이" width="640" height="640"></div><h2>하트 봄담이</h2><div class="links"><a class="download" href="assets/heart-bomdam-animated.gif" download="AI봄_움직이는_하트봄담이.gif">움직이는 GIF 다운로드 ↓</a><a class="download gold" href="assets/damwol-open.png" download="AI봄_하트봄담이.png">정지 PNG 다운로드 ↓</a></div></article><article class="card"><div class="art"><img src="assets/golden-bomdam-animated.gif" alt="금빛 옷과 방패를 든 황금 곳간지기 봄담이가 움직이며 눈을 깜빡이는 모습" width="640" height="440"></div><h2>황금 곳간지기 봄담이</h2><div class="links"><a class="download" href="assets/golden-bomdam-animated.gif" download="AI봄_움직이는_황금봄담이.gif">움직이는 GIF 다운로드 ↓</a><a class="download gold" href="assets/bomdam-golden-keeper.png" download="AI봄_황금곳간봄담이.png">정지 PNG 다운로드 ↓</a></div></article></div><p class="small">GIF는 36개 장면이 반복되며 배경이 투명합니다. 이 다운로드 미리보기는 계속 움직입니다. 정지 이미지는 PNG를 선택하세요.</p><a class="back" href="index.html">AI봄 홈페이지로 돌아가기 →</a></main></body></html>
