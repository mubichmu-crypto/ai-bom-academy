<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f4e6e2"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 01</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">내 마음의 5단계 노래 시트</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">감정이 달라지는 다섯 순간을 한 곡의 흐름으로.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">먼저 적기</tspan><tspan x="64" y="274">이 노래를 들려주고 싶은 사람: [나 / 소중한 사람]</tspan><tspan x="64" y="299">노래가 시작되는 실제 장면: [언제, 어디서, 무엇을 보고 있었나요?]</tspan><tspan x="64" y="324">꼭 남기고 싶은 내 말 한 줄: [                    ]</tspan><tspan x="64" y="349"></tspan><tspan x="64" y="374">다섯 장면 채우기 — 아래 감정은 예시이니 내 흐름으로 바꿔도 좋아요.</tspan><tspan x="64" y="399">1. 먹먹함: 말로 못 꺼낸 마음 / 장면 [          ]</tspan><tspan x="64" y="424">2. 그리움: 떠오르는 사람이나 순간 / 장면 [          ]</tspan><tspan x="64" y="449">3. 흔들림: 붙잡고 싶은 것과 놓아야 할 것 / 장면 [          ]</tspan><tspan x="64" y="474">4. 받아들임: 지금 알게 된 작은 사실 / 장면 [          ]</tspan><tspan x="64" y="499">5. 작은 희망: 내일의 나에게 건네는 말 / 장면 [          ]</tspan><tspan x="64" y="524"></tspan><tspan x="64" y="549">AI에게 붙여넣기</tspan><tspan x="64" y="574">위의 실제 경험을 바탕으로 노래 방향 3가지를 제안해 줘. 각 방향마다 제목, 중심 감</tspan><tspan x="64" y="599">정, 후렴의 핵심 한 줄, 어울리는 악기와 속도를 알려 줘. 다섯 감정이 억지로 밝아지</tspan><tspan x="64" y="624">지 않게 연결하고, 내가 고른 방향으로 가사를 써 줘. 없는 추억이나 사실은 만들지 </tspan><tspan x="64" y="649">말고, 필요한 질문은 하나씩 해 줘. 특정 가수나 기존 노래를 그대로 흉내 내지 말아 </tspan><tspan x="64" y="674">줘.</tspan><tspan x="64" y="699"></tspan><tspan x="64" y="724">한 걸음 더</tspan><tspan x="64" y="749">후렴의 말이 내 말처럼 들리는지 소리 내어 읽고 고치세요. 음악 생성 도구에는 완성</tspan><tspan x="64" y="774">된 가사와 원하는 악기·속도를 따로 전달하세요.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>