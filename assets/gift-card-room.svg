<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e4ecd9"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 04</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">있는 가구로 방 배치 바꾸기</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">새로 사기 전에, 불편한 동선부터 점검하는 한 장.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">그려보기</tspan><tspan x="64" y="274">방 가로·세로: [       ] / 문·창문·콘센트 위치: [       ]</tspan><tspan x="64" y="299">꼭 둘 가구와 크기: [                    ]</tspan><tspan x="64" y="324">이 공간에서 자주 하는 일 3가지: [                    ]</tspan><tspan x="64" y="349">가장 불편한 순간: [                    ]</tspan><tspan x="64" y="374">이번에 쓸 수 있는 예산: [0원 /       원]</tspan><tspan x="64" y="399"></tspan><tspan x="64" y="424">먼저 확인하기</tspan><tspan x="64" y="449">문과 서랍이 끝까지 열리나요? [ ]</tspan><tspan x="64" y="474">자주 다니는 길에 물건이나 전선이 있나요? [ ]</tspan><tspan x="64" y="499">빛과 콘센트가 필요한 자리에 있나요? [ ]</tspan><tspan x="64" y="524">옮기기 전 가구의 크기를 재었나요? [ ]</tspan><tspan x="64" y="549"></tspan><tspan x="64" y="574">AI에게 붙여넣기</tspan><tspan x="64" y="599">위 조건에서 새 가구를 사지 않는 배치 2가지와 소액으로 바꾸는 배치 1가지를 제안해</tspan><tspan x="64" y="624"> 줘. 각 안의 동선, 장점, 불편할 수 있는 점, 먼저 옮길 물건을 설명해 줘. 방의 치</tspan><tspan x="64" y="649">수가 모자라면 추측하지 말고 물어봐 줘. 사진을 보면 내 물건의 실제 크기를 단정하</tspan><tspan x="64" y="674">지 말고 확인할 치수를 알려 줘. 구조·전기·가스 공사 대신 가구 배치와 수납 범위에</tspan><tspan x="64" y="699">서 제안해 줘.</tspan><tspan x="64" y="724"></tspan><tspan x="64" y="749">한 걸음 더</tspan><tspan x="64" y="774">실제 이동 전 바닥에 종이나 테이프로 가구 자리를 표시해 보세요. 무거운 가구는 혼</tspan><tspan x="64" y="799">자 무리해서 옮기지 마세요.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>