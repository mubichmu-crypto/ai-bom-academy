<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#e3edf0"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 02</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">프로필 분위기 3가지</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">자연스러움·차분함·밝은 인상 중 나다운 방향 찾기.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">준비</tspan><tspan x="64" y="274">내가 사용할 권한이 있는 사진 한 장을 고르세요.</tspan><tspan x="64" y="299">사진을 올릴 곳: [블로그 / 강사 소개 / 업무 / 개인 기록]</tspan><tspan x="64" y="324">그대로 지킬 특징: [얼굴형, 안경, 머리, 표정 등]</tspan><tspan x="64" y="349">바꾸고 싶은 부분: [배경, 조명, 옷 색 등]</tspan><tspan x="64" y="374"></tspan><tspan x="64" y="399">AI에게 붙여넣기 — 사진 첨부 후 사용</tspan><tspan x="64" y="424">첨부한 내 사진으로 프로필 방향 3가지를 제안해 줘.</tspan><tspan x="64" y="449">1. 자연스러운 일상: 부드러운 자연광, 단순한 배경, 편안한 표정.</tspan><tspan x="64" y="474">2. 차분한 소개: 정돈된 배경, 은은한 조명, 안정적인 인상.</tspan><tspan x="64" y="499">3. 밝은 창작자: 맑은 색감, 과하지 않은 생동감, 친근한 분위기.</tspan><tspan x="64" y="524">각 방향의 배경·색·구도와 어울리는 사용처를 비교해 줘. 위에서 지키기로 한 얼굴 특</tspan><tspan x="64" y="549">징을 유지하고, 나이나 체형을 임의로 바꾸지 말아 줘. 내가 고른 방향부터 한 장씩 </tspan><tspan x="64" y="574">진행해 줘. 이미지 생성이 불가능하면 가능한 작업과 제작 요청문을 알려 줘.</tspan><tspan x="64" y="599"></tspan><tspan x="64" y="624">고르기</tspan><tspan x="64" y="649">내 얼굴이 자연스럽게 남았나요? [ ]</tspan><tspan x="64" y="674">작은 원형 사진에서도 얼굴이 잘 보이나요? [ ]</tspan><tspan x="64" y="699">내 소개와 어울리나요? [ ]</tspan><tspan x="64" y="724"></tspan><tspan x="64" y="749">한 걸음 더</tspan><tspan x="64" y="774">같은 구도를 유지하고 배경색만 3가지로 비교하면 선택이 쉬워집니다. 원본은 따로 보</tspan><tspan x="64" y="799">관하세요.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>