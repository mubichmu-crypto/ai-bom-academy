<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3e9d5"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 05</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">반복 업무 덜어내는 설계표</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">AI에게 맡길 일과 내가 확인할 일을 구분하기.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">한 가지 일만 고르기</tspan><tspan x="64" y="274">반복하는 일: [                    ]</tspan><tspan x="64" y="299">일주일에 몇 번, 한 번에 몇 분: [                    ]</tspan><tspan x="64" y="324">시작할 때 가진 자료: [                    ]</tspan><tspan x="64" y="349">끝났다고 판단하는 기준: [                    ]</tspan><tspan x="64" y="374"></tspan><tspan x="64" y="399">작은 단계로 나누기</tspan><tspan x="64" y="424">1. 자료 모으기: [                    ]</tspan><tspan x="64" y="449">2. 정리·비교·초안: [                    ]</tspan><tspan x="64" y="474">3. 사람이 확인할 내용: [                    ]</tspan><tspan x="64" y="499">4. 최종 승인과 전달: [                    ]</tspan><tspan x="64" y="524"></tspan><tspan x="64" y="549">AI에게 붙여넣기</tspan><tspan x="64" y="574">위 업무를 단계별로 나누고, AI가 도울 부분 / 내가 판단할 부분 / 확인할 위험을 표</tspan><tspan x="64" y="599">로 보여 줘. 지금 쓸 수 있는 도구 안에서 가장 작은 시험 1가지를 제안해 줘. 실행 </tspan><tspan x="64" y="624">전 필요한 자료를 물어보고, 실제로 하지 않은 전송·예약·자동화를 했다고 말하지 말</tspan><tspan x="64" y="649">아 줘. 민감한 원본을 요구하지 말고 가짜 예시 자료로 먼저 시험할 방법을 알려 줘.</tspan><tspan x="64" y="674"></tspan><tspan x="64" y="699">전후 비교</tspan><tspan x="64" y="724">시험 전 걸린 시간: [       분]</tspan><tspan x="64" y="749">시험 후 걸린 시간과 검토 시간: [       분 +       분]</tspan><tspan x="64" y="774">틀린 내용이나 추가 확인할 것: [                    ]</tspan><tspan x="64" y="799"></tspan><tspan x="64" y="824">한 걸음 더</tspan><tspan x="64" y="849">실제 고객·회사 자료 대신 가짜 자료 3건으로 먼저 확인하세요. 시간보다 오류가 늘었</tspan><tspan x="64" y="874">다면 맡기는 범위를 줄여 보세요.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>