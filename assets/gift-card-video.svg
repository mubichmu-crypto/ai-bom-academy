<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#ebe5f2"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 03</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">추억 한 장, 15초 영상 콘티</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">사진 한 장에서 시작하는 장면·자막·소리 설계.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">사진 속 사실</tspan><tspan x="64" y="274">언제·어디서: [                    ]</tspan><tspan x="64" y="299">실제로 기억하는 일: [                    ]</tspan><tspan x="64" y="324">화면에 담고 싶은 감정: [                    ]</tspan><tspan x="64" y="349"></tspan><tspan x="64" y="374">세 장면의 기본 흐름</tspan><tspan x="64" y="399">0~5초: 사진 전체를 천천히 보여주기. 자막은 장소나 시기 한 줄.</tspan><tspan x="64" y="424">5~10초: 손, 창문, 꽃처럼 의미 있는 부분으로 부드럽게 가까워지기.</tspan><tspan x="64" y="449">10~15초: 사진 전체로 돌아오며 내 말 한 줄로 끝내기.</tspan><tspan x="64" y="474">끝에 남길 내 말: [                    ]</tspan><tspan x="64" y="499"></tspan><tspan x="64" y="524">AI에게 붙여넣기</tspan><tspan x="64" y="549">첨부한 사진과 위의 기억을 바탕으로 15초 영상 콘티를 3가지 분위기로 제안해 줘. 각</tspan><tspan x="64" y="574"> 안을 시간대 / 화면 움직임 / 짧은 자막 / 소리로 정리해 줘. 사진에 없는 사건이나 </tspan><tspan x="64" y="599">사람의 말은 사실처럼 만들지 말아 줘. 인물의 얼굴이나 표정이 달라지는 연출보다 사</tspan><tspan x="64" y="624">진의 구도·빛·카메라 움직임으로 분위기를 살려 줘. 내가 고르면 장면별 영상 제작 요</tspan><tspan x="64" y="649">청문을 써 줘.</tspan><tspan x="64" y="674"></tspan><tspan x="64" y="699">완성 전 확인</tspan><tspan x="64" y="724">사진을 쓸 권한과 함께 나온 사람의 의사를 확인했나요? [ ]</tspan><tspan x="64" y="749">자막 없이도 장면이 편안한가요? [ ]</tspan><tspan x="64" y="774">음악을 사용할 수 있는지 확인했나요? [ ]</tspan><tspan x="64" y="799"></tspan><tspan x="64" y="824">한 걸음 더</tspan><tspan x="64" y="849">영상 도구에 넣을 때는 한 장면씩 만들어 연결하세요. 원본 사진을 그대로 두고 천천</tspan><tspan x="64" y="874">히 확대하는 편집만으로도 시작할 수 있습니다.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>