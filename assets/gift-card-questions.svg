<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#ddede6"/></linearGradient></defs><rect width="794" height="1123" fill="url(#paper)"/><rect x="30" y="30" width="734" height="1063" rx="12" fill="none" stroke="#b8ad92"/><path d="M664 142 Q695 105 711 61 M685 115 Q654 113 658 91 Q680 86 685 115 M699 86 Q723 85 726 65 Q705 62 699 86" fill="none" stroke="#8b9d7d" stroke-width="2"/><text x="64" y="82" font-family="Malgun Gothic,sans-serif" font-size="13" letter-spacing="2" fill="#77795f">AI봄 · 당신께 드리는 작은 선물 06</text><text x="64" y="132" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="#344f40">AI에게 잘 부탁하는 문장 12개</text><text x="64" y="166" font-family="Malgun Gothic,sans-serif" font-size="16" fill="#64715b">막막한 첫 질문부터 결과물을 다듬는 부탁까지.</text><path d="M64 190H730" stroke="#c9c4b3"/><text font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" font-size="16" fill="#344f40"><tspan x="64" y="224"></tspan><tspan x="64" y="249">처음 시작할 때</tspan><tspan x="64" y="274">1. 내가 원하는 것이 아직 흐릿해. 내 상황을 먼저 한 가지씩 물어봐 줘.</tspan><tspan x="64" y="299">2. 내 목표는 [목표]야. 오늘 [시간] 안에 해볼 가장 작은 첫걸음을 제안해 줘.</tspan><tspan x="64" y="324">3. 지금 가진 것은 [자료]이고 꼭 지킬 것은 [조건]이야. 이 범위에서 도와줘.</tspan><tspan x="64" y="349"></tspan><tspan x="64" y="374">여러 방향이 필요할 때</tspan><tspan x="64" y="399">4. 같은 목적을 이루는 3가지 방향을 보여 주고 차이를 비교해 줘.</tspan><tspan x="64" y="424">5. 새로 사거나 가입하기 전에, 지금 가진 것으로 해볼 방법부터 알려 줘.</tspan><tspan x="64" y="449">6. 내가 놓친 조건이 있으면 결과를 만들기 전에 먼저 물어봐 줘.</tspan><tspan x="64" y="474"></tspan><tspan x="64" y="499">결과가 마음에 안 들 때</tspan><tspan x="64" y="524">7. [좋았던 부분]은 남기고 [바꿀 부분]만 고쳐 줘.</tspan><tspan x="64" y="549">8. 표현이 너무 막연해. 내가 바로 실행할 행동과 예시로 바꿔 줘.</tspan><tspan x="64" y="574">9. 내 말투를 살리고 과장된 칭찬이나 꾸밈말을 줄여 줘.</tspan><tspan x="64" y="599"></tspan><tspan x="64" y="624">내 것으로 마무리할 때</tspan><tspan x="64" y="649">10. 사실, 네 추정, 내가 확인해야 할 것을 구분해 줘.</tspan><tspan x="64" y="674">11. 초보자가 따라갈 순서와 익숙한 사람이 조절할 항목을 함께 보여 줘.</tspan><tspan x="64" y="699">12. 지금 결과물을 어디에 쓸지 확인한 다음, 그 형식에 맞게 정리해 줘.</tspan><tspan x="64" y="724"></tspan><tspan x="64" y="749">작은 사용법</tspan><tspan x="64" y="774">12개를 한꺼번에 넣지 말고 지금 필요한 한 문장만 골라 쓰세요. 괄호 안을 내 상황으</tspan><tspan x="64" y="799">로 바꿔 주세요. 개인 정보나 공개하면 안 되는 자료는 넣지 마세요.</tspan></text><path d="M64 1005H730" stroke="#c9c4b3"/><text x="64" y="1036" font-family="Malgun Gothic,sans-serif" font-size="13" fill="#64715b">내 이야기로 채우고, 나에게 필요한 만큼만 사용하세요.</text><text x="64" y="1061" font-family="Malgun Gothic,sans-serif" font-size="12" fill="#64715b">AI봄 스튜디오 · 무료 제작 시트 · 본문 12pt / A4 한 장</text></svg>